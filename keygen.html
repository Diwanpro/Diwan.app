<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d2138">
<title>ديوان — مولّد مفاتيح التفعيل</title>
<link rel="icon" href="./logo.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{
  --navy:#0d2138;--navy2:#153250;--surface:#fff;--ink:#0f1e2e;--muted:#566677;--line:#e0e6ed;
  --teal:#0f8f86;--teal-ink:#0b6e67;--teal-soft:#dff3f1;--brass:#b3832a;--brass-soft:#f6edd9;
  --bad:#c0392b;--bad-soft:#fbe6e3;--ok:#2b7a4e;--ok-soft:#e1f2e9;
  --shadow:0 2px 4px rgba(6,16,25,.18),0 26px 60px -28px rgba(6,16,25,.8);
  --serif:'Amiri','Traditional Arabic','Times New Roman',serif;
  --sans:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);line-height:1.6;
  background:
    radial-gradient(900px 520px at 88% -10%,rgba(15,143,134,.28),transparent 60%),
    radial-gradient(700px 420px at 6% 108%,rgba(179,131,42,.20),transparent 62%),
    linear-gradient(160deg,var(--navy2),var(--navy) 55%,#081726);
  -webkit-text-size-adjust:100%;
  padding:26px 16px 40px;display:flex;justify-content:center;align-items:flex-start;
}
.wrap{width:100%;max-width:520px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px;color:#eaf1f7}
.brand img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:12px;padding:4px;flex:none}
.brand h1{margin:0;font-size:19px;font-weight:700;letter-spacing:.2px}
.brand p{margin:2px 0 0;font-size:12.5px;color:#a9bccd}
.card{
  background:var(--surface);border-radius:18px;box-shadow:var(--shadow);
  border-top:3px solid var(--brass);padding:20px 18px 18px;
}
.card h2{margin:0 0 4px;font-size:16px;font-weight:700}
.card .sub{margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.75}
.fld{display:block;margin-bottom:14px}
.fld label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.fld input{
  width:100%;padding:13px 14px;font-family:var(--mono);font-size:17px;letter-spacing:2px;
  text-align:center;text-transform:uppercase;color:var(--ink);
  background:#fbfcfe;border:1.5px solid var(--line);border-radius:12px;outline:0;
  transition:border-color .15s,box-shadow .15s;
}
.fld input::placeholder{color:#a9b6c3;letter-spacing:2px}
.fld input:focus{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-soft);background:#fff}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:13px 18px;border-radius:12px;border:1px solid var(--teal);background:var(--teal);
  color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 10px 22px -12px var(--teal);transition:filter .15s,transform .05s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;cursor:not-allowed;box-shadow:none}
.btn svg{width:18px;height:18px;flex:none}
.msg{min-height:20px;margin:10px 0 0;font-size:12.5px;font-weight:600;color:var(--bad)}
.msg.ok{color:var(--ok)}
.out{margin-top:16px;padding-top:16px;border-top:1px dashed var(--line);display:none}
.out.on{display:block;animation:fade .22s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.out label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.keyrow{display:flex;gap:8px;align-items:stretch}
.key{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:1.5px;color:var(--brass);
  background:var(--brass-soft);border:1.5px solid #e8d7b3;border-radius:12px;
  padding:13px 10px;user-select:all;word-break:break-all;text-align:center;
}
.copy{
  flex:none;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:12px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;
  font-size:13.5px;font-weight:600;cursor:pointer;transition:border-color .15s,background .15s;
}
.copy:hover{border-color:var(--teal);background:var(--teal-soft)}
.copy.done{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.copy svg{width:16px;height:16px;flex:none}
.hint{margin:10px 0 0;font-size:11.5px;color:var(--muted);line-height:1.7}
.note{
  margin:16px 0 0;display:flex;gap:8px;align-items:flex-start;
  font-size:11.5px;color:#8fa3b5;line-height:1.75;
}
.note svg{width:15px;height:15px;flex:none;margin-top:3px;opacity:.8}
@media (max-width:430px){
  body{padding:18px 12px 30px}
  .card{padding:17px 15px 15px;border-radius:16px}
  .keyrow{flex-direction:column}
  .copy{padding:11px 14px;justify-content:center}
  .key{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <img src="./logo.png" alt="شعار ديوان">
    <div>
      <h1>مولّد مفاتيح التفعيل</h1>
      <p>Diwan · Générateur de clés · يعمل دون إنترنت</p>
    </div>
  </div>

  <main class="card">
    <h2>مفتاح تفعيل جديد</h2>
    <p class="sub">أدخل معرّف الجهاز الظاهر في شاشة «الترخيص» داخل التطبيق، ثم انسخ المفتاح وأرسله للمكتب.</p>

    <form id="kgForm" novalidate autocomplete="off">
      <div class="fld">
        <label for="devId">معرّف الجهاز (Device ID)</label>
        <input id="devId" dir="ltr" inputmode="text" spellcheck="false" autocapitalize="characters"
               autocomplete="off" maxlength="9" placeholder="XXXX-XXXX" aria-describedby="kgMsg">
      </div>
      <button class="btn" type="submit" id="genBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 7h3a5 5 0 0 1 0 10h-3"/><path d="M9 17H6a5 5 0 0 1 0-10h3"/><path d="M8 12h8"/></svg>
        توليد المفتاح
      </button>
      <p class="msg" id="kgMsg" role="alert" aria-live="polite"></p>
    </form>

    <div class="out" id="kgOut">
      <label for="keyOut">مفتاح التفعيل الناتج</label>
      <div class="keyrow">
        <div class="key" id="keyOut" dir="ltr" role="textbox" aria-readonly="true"></div>
        <button class="copy" type="button" id="copyBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
          <span id="copyLbl">نسخ المفتاح</span>
        </button>
      </div>
      <p class="hint" id="kgFor"></p>
    </div>

    <p class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span>صفحة محلية بالكامل: لا تُرسل أي بيانات ولا تحتاج اتصالاً. تُخزَّن آخر بذرة استخدمتها على هذا الجهاز لتسهيل إعادة التوليد.</span>
    </p>
  </main>
</div>

<script>
(function(){
  'use strict';
  /* نفس خوارزمية التطبيق تماماً (tools/keygen.mjs + كتلة الترخيص في index.html):
     جسم من 12 خانة + توقيع من 4 خانات، أبجدية Crockford، البذور مخزّنة معكوسة/مشفّرة. */
  var _rev=function(b){try{var v=atob(b);return v.split('').reverse().join('')}catch(_){return ''}};
  var SA=_rev('N1J6fEF8OW5hd2lE'),SB=_rev('MlFrfEJ8OW5hd2lE'),SC=_rev('NU5tfEN8OW5hd2lE'),
      AL='0123456789ABCDEFGHJKMNPQRSTVWXYZ';

  function H(str){var h=0x811c9dc5,i,s=String(str);for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0}return h>>>0}
  function X(x){x=(x||0x9e3779b9)>>>0;x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x>>>0}
  function sig(p){var x=(H(SC+'|'+p)||0x1234567)>>>0,o='',i;for(i=0;i<4;i++){x=X(x);o+=AL.charAt(x&31)}return o}
  function body(seed){var x=(H(SA+'|'+seed)^H(SB+'|'+seed+'~'))>>>0;x=x||0x9e3779b9;var o='',i;for(i=0;i<12;i++){x=X(x);o+=AL.charAt(x&31)}return o}
  function fmt(k){return String(k).replace(/(.{4})(?=.)/g,'$1-')}
  function norm(k){return String(k||'').toUpperCase().replace(/[^0-9A-Z]/g,'')}
  function eq(a,b){if(a.length!==b.length)return false;var r=0,i;for(i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0}
  function makeKey(seed){var b=body(String(seed));return fmt(b+sig(b))}
  function validKey(k){var n=norm(k),i;if(n.length!==16)return false;for(i=0;i<16;i++)if(AL.indexOf(n.charAt(i))<0)return false;return eq(n.slice(12),sig(n.slice(0,12)))}

  /* واجهة */
  var form=document.getElementById('kgForm'),inp=document.getElementById('devId'),
      msg=document.getElementById('kgMsg'),out=document.getElementById('kgOut'),
      keyEl=document.getElementById('keyOut'),copyBtn=document.getElementById('copyBtn'),
      copyLbl=document.getElementById('copyLbl'),forEl=document.getElementById('kgFor'),
      LS='diwan_keygen_seed',cur='';

  function setMsg(txt,ok){msg.textContent=txt||'';msg.className='msg'+(ok?' ok':'')}
  function devIdFmt(v){var n=norm(v).replace(/[^0-9A-Z]/g,'').slice(0,8);return n.length>4?n.slice(0,4)+'-'+n.slice(4):n}

  /* معرّف الجهاز: 8 خانات بصيغة XXXX-XXXX */
  inp.addEventListener('input',function(){
    var p=inp.selectionStart,end=inp.value.length,atEnd=(p===null||p===end);
    inp.value=devIdFmt(inp.value);
    if(!atEnd){try{inp.setSelectionRange(p,p)}catch(_){}}
    setMsg('');
  });
  inp.addEventListener('blur',function(){inp.value=devIdFmt(inp.value)});

  form.addEventListener('submit',function(e){
    e.preventDefault();
    var raw=norm(inp.value);
    if(raw.length<4){setMsg('أدخل معرّف الجهاز أولاً (٤ خانات على الأقل)');try{inp.focus()}catch(_){}return}
    /* البذرة = معرّف الجهاز بصيغته المعروضة (XXXX-XXXX) تماماً كما يُمرَّر إلى tools/keygen.mjs */
    var seed=(raw.length===8)?fmt(raw):raw;
    cur=makeKey(seed);
    if(!validKey(cur)){setMsg('تعذّر توليد مفتاح صالح — تحقق من المعرّف');out.classList.remove('on');return}
    keyEl.textContent=cur;
    forEl.textContent='المعرّف: '+seed+' · ١٦ خانة · تحقّق: ✓ مفتاح صالح';
    out.classList.add('on');
    setMsg('تم توليد المفتاح — انسخه وأرسله للمكتب','ok');
    resetCopy();
    try{localStorage.setItem(LS,raw)}catch(_){}
  });

  function resetCopy(){copyBtn.classList.remove('done');copyLbl.textContent='نسخ المفتاح'}

  function fallbackCopy(txt){
    try{
      var ta=document.createElement('textarea');
      ta.value=txt;ta.setAttribute('readonly','');
      ta.style.cssText='position:fixed;top:0;left:-9999px;opacity:0';
      document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,txt.length);
      var ok=document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(_){return false}
  }
  function afterCopy(ok){
    if(!ok){setMsg('تعذّر النسخ تلقائياً — اضغط مطولاً على المفتاح لتحديده ثم انسخه');return}
    copyBtn.classList.add('done');copyLbl.textContent='تم النسخ ✓';
    setMsg('تم نسخ المفتاح إلى الحافظة','ok');
    setTimeout(resetCopy,2200);
  }
  copyBtn.addEventListener('click',function(){
    if(!cur)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(cur).then(function(){afterCopy(true)},function(){afterCopy(fallbackCopy(cur))});
    }else{afterCopy(fallbackCopy(cur))}
  });

  /* استرجاع آخر معرّف */
  try{
    var last=localStorage.getItem(LS);
    if(last){inp.value=devIdFmt(last);setTimeout(function(){try{inp.select()}catch(_){}},60)}
  }catch(_){}
  try{inp.focus()}catch(_){}

  /* للاختبار الآلي */
  window.__kg={makeKey:makeKey,validKey:validKey,norm:norm,fmt:fmt};
})();
</script>
</body>
</html>
