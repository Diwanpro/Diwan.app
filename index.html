<style>
:root{--bg:#f1f4f8;--surface:#fff;--ink:#0f1e2e;--muted:#566677;--line:#e0e6ed;--navy:#0d2138;--navy2:#153250;--teal:#0f8f86;--teal-ink:#0b6e67;--teal-soft:#dff3f1;--brass:#b3832a;--brass-soft:#f6edd9;--bad:#c0392b;--bad-soft:#fbe6e3;--ok:#2b7a4e;--ok-soft:#e1f2e9;--warn:#b0700d;--warn-soft:#fcefd8;--info:#245f9f;--info-soft:#e2edf8;--shadow:0 1px 2px rgba(13,33,56,.06),0 8px 24px -14px rgba(13,33,56,.22);--flip:1;--serif:'Amiri','Traditional Arabic','Times New Roman',serif;--sans:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif}

:root.dark{--bg:#08121d;--surface:#101d2b;--ink:#e8eef4;--muted:#93a4b5;--line:#21344a;--navy:#061019;--navy2:#0b2033;--teal:#2bc0b4;--teal-ink:#5fd6cc;--teal-soft:#0f2e31;--brass:#dcae55;--brass-soft:#2c2412;--bad:#f08b7f;--bad-soft:#341a17;--ok:#72c796;--ok-soft:#14291e;--warn:#e3a84f;--warn-soft:#2e2310;--info:#7fb8e6;--info-soft:#102434;--shadow:none}
html[dir=rtl]{--flip:-1}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}

button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}

.money{direction:ltr;unicode-bidi:isolate;display:inline-block;font-variant-numeric:tabular-nums;white-space:nowrap}
.app{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#d6e2ee;padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow:auto;z-index:30;/* V9-FIX-01 */-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;-webkit-tap-highlight-color:transparent;height:100dvh;padding-bottom:max(20px,env(safe-area-inset-bottom))}

.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 8px 16px;border-bottom:1px solid rgba(255,255,255,.1);text-align:center}

.grp{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;padding:6px 12px;border-radius:8px}

.avatar.m{background:var(--brass-soft);color:var(--brass);border-color:var(--brass)}.avatar.s{background:var(--info-soft);color:var(--info);border-color:var(--info)}.avatar.t{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.avatar.sm{width:26px;height:26px;font-size:13px}.stack-av{display:flex}.stack-av .avatar+.avatar{margin-inline-start:-8px;box-shadow:0 0 0 2px var(--surface)}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 28px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top .office{font-family:var(--serif);font-size:21px;font-weight:700;white-space:nowrap}.top .date{color:var(--muted);font-size:13px;white-space:nowrap}
.search{position:relative;flex:1;max-width:420px;margin-inline:12px}
.search input{width:100%;padding:9px 40px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.search svg{position:absolute;inset-inline-start:13px;top:50%;translate:0 -50%;width:18px;height:18px;color:var(--muted)}
.search kbd{position:absolute;inset-inline-end:10px;top:50%;translate:0 -50%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;color:var(--muted)}
.results{position:absolute;inset-inline:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -16px rgba(0,0,0,.35);padding:6px;display:none;z-index:40}.results.on{display:block}
.results button{display:block;width:100%;text-align:start;background:none;border:0;padding:9px 12px;border-radius:10px}.results button:hover{background:var(--bg)}
.results small{color:var(--muted);display:block}
.tools{margin-inline-start:auto;display:flex;align-items:center;gap:8px}
.iconbtn{border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:inline-flex;align-items:center;gap:6px;position:relative;background:var(--surface);font-weight:500;font-size:13.5px}.iconbtn:hover{border-color:var(--teal)}
.menubtn{display:none}
.dot{position:absolute;top:-5px;inset-inline-end:-5px;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.pill{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface)}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--ok)}.pill.off{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}.pill.off i{background:var(--warn)}
.pill.sync i{background:var(--info);animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.3}}
.role-sel{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}.role-sel select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--surface);font-size:13px}
.notif{position:absolute;inset-inline-end:0;top:calc(100% + 8px);width:min(380px,92vw);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 20px 44px -16px rgba(0,0,0,.4);display:none;z-index:50;padding:14px}.notif.on{display:block}
.notif h3{font-size:16px;margin-bottom:6px}.notif li{list-style:none;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.notif ul{margin:0;padding:0}.bell-wrap{position:relative}
.bar-alert{display:flex;align-items:center;gap:12px;padding:10px 28px;background:var(--bad);color:#fff;font-weight:500;flex-wrap:wrap}
.bar-alert button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:10px;padding:3px 12px}.bar-alert button:hover{background:rgba(255,255,255,.3)}
.bar-alert .grow{flex:1;min-width:200px}
.bar-off{display:flex;align-items:center;gap:12px;padding:9px 28px;background:var(--warn-soft);color:var(--warn);border-bottom:1px solid var(--warn);flex-wrap:wrap;font-size:14px}
.bar-off button{background:var(--surface);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:2px 12px}
.demo-note{background:var(--brass-soft);padding:6px 28px;font-size:12.5px;border-bottom:1px solid var(--line)}
.view{padding:26px 28px 90px;max-width:1360px;width:100%;animation:rise .28s ease both}

.page-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}
.page-h h1{font-size:34px}.page-h p{margin:2px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff;box-shadow:0 8px 20px -10px var(--teal)}.btn.primary:hover{filter:brightness(1.08)}
.btn.big{padding:12px 22px;font-size:16px}.btn.sm{padding:4px 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.ghost{background:none;border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px}
.kpi{padding:18px;display:flex;gap:14px;align-items:center}
.kpi .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none}.kpi .ic svg{width:25px;height:25px}
.kpi .ic.teal{background:var(--teal-soft);color:var(--teal-ink)}.kpi .ic.info{background:var(--info-soft);color:var(--info)}.kpi .ic.brass{background:var(--brass-soft);color:var(--brass)}.kpi .ic.bad{background:var(--bad-soft);color:var(--bad)}
.kpi span{color:var(--muted);font-size:13.5px;display:block}
.kpi b{font-size:30px;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums}.kpi b.sm{font-size:22px}
.kpi small{display:block;color:var(--muted);font-size:12.5px}.kpi small.warn{color:var(--bad);font-weight:600}
.g2{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:20px;margin-bottom:20px}
.g2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-bottom:20px}
.chip{display:inline-block;padding:1px 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.info{background:var(--info-soft);color:var(--info)}.chip.teal{background:var(--teal-soft);color:var(--teal-ink)}.chip.mute{background:var(--bg);color:var(--muted);border:1px solid var(--line)}.chip.brass{background:var(--brass-soft);color:var(--brass)}
.roll{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-top:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.day{border-inline-start:1px solid var(--line);min-height:200px;display:flex;flex-direction:column}.day:first-child{border-inline-start:0}
.day-h{padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.day-h b{font-family:var(--serif);font-size:18px}.day-h span{color:var(--muted);font-size:12.5px}
.day.today .day-h{background:var(--navy2);color:#fff}.day.today .day-h span{color:#9fd8d3}
.day-b{padding:8px;display:flex;flex-direction:column;gap:8px;flex:1}
.ev{width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-inline-start:4px solid var(--teal);border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.5}.ev:hover{border-color:var(--teal)}
.ev time{display:block;font-weight:700;color:var(--teal-ink)}.ev small{display:block;color:var(--muted)}
.ev.dl{border-inline-start-color:var(--brass)}.ev.dl time{color:var(--brass)}
.empty{color:var(--muted);font-size:13px;text-align:center;margin:auto;padding:14px}
.empty-big{padding:40px 20px;text-align:center;color:var(--muted)}.empty-big h3{font-family:var(--serif);font-size:20px;color:var(--ink);margin-bottom:8px}.empty-big p{margin:0 0 16px;font-size:14px}
.rows{display:flex;flex-direction:column}
.row{display:grid;gap:12px;align-items:center;padding:13px 6px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row.head{color:var(--muted);font-size:13px;padding-top:2px;padding-bottom:8px;font-weight:600}

.cases .row{grid-template-columns:.9fr 2.3fr 1.7fr 1fr 1fr .9fr}
button.row{background:none;border:0;border-top:1px solid var(--line);width:100%;text-align:start;border-radius:0}button.row:hover{background:var(--bg)}
.row small,.sub{display:block;color:var(--muted);font-size:13px}
.dlrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:start}.dlrow:first-child{border-top:0}button.dlrow:hover{background:var(--bg)}
.left{min-width:58px;text-align:center;border-radius:12px;padding:4px 6px;font-weight:700;line-height:1.2}.left small{display:block;font-weight:500;font-size:11.5px}
.left.bad{background:var(--bad-soft);color:var(--bad)}.left.warn{background:var(--warn-soft);color:var(--warn)}.left.ok{background:var(--ok-soft);color:var(--ok)}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#2bc0b4)}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;padding:12px 18px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-current=true]{color:var(--teal-ink);border-bottom-color:var(--teal)}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line)}.task:first-child{border-top:0}
.chk{width:22px;height:22px;accent-color:var(--teal);cursor:pointer}
.task.done .tt{text-decoration:line-through;color:var(--muted)}.task .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tt{font-weight:500}
.steps{display:grid;grid-template-columns:repeat(4,1fr);margin:6px 0 4px}
.step{position:relative;text-align:center;font-size:13px;color:var(--muted);padding-top:30px}
.step::before{content:"";position:absolute;top:8px;inset-inline:0;height:3px;background:var(--line)}
.step::after{content:"";position:absolute;top:0;inset-inline-start:50%;translate:calc(50% * var(--flip) * -1) 0;width:19px;height:19px;border-radius:50%;background:var(--surface);border:3px solid var(--line)}
.step.done{color:var(--ink)}.step.done::before{background:var(--teal)}.step.done::after{background:var(--teal);border-color:var(--teal)}
.step.now{color:var(--ink);font-weight:700}

.step.now::after{border-color:var(--brass)}
.step:first-child::before{inset-inline-start:50%}.step:last-child::before{inset-inline-end:50%}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.cal-h h2{font-size:24px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:14px;overflow:hidden}

.cal .c.out{background:var(--bg);color:var(--muted);cursor:default}

.cal .c:not(.out):hover{background:var(--teal-soft)}.cal .c.sel{outline:2px solid var(--teal);outline-offset:-2px}

.cal .c .e{display:block;margin-top:3px;padding:1px 6px;border-radius:6px;background:var(--info-soft);color:var(--info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .c .e.dl{background:var(--brass-soft);color:var(--brass)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.client{padding:18px;display:flex;flex-direction:column;gap:6px}

function computeMonthlyCollections(){
 var pays=S.pays||[], buckets={};
 pays.forEach(function(p){
  var d=D(p.d||p.date); if(!d||isNaN(d.getTime()))return;
  var m=String(d.getMonth()+1);
  buckets[m]=(buckets[m]||0)+(+p.a||+p.amount||0);
 });
 // last 5 months relative to TODAY
 var out=[], base=new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
 for(var i=4;i>=0;i--){
  var dt=new Date(base); dt.setMonth(dt.getMonth()-i);
  var key=String(dt.getMonth()+1);
  out.push([key, buckets[key]||0]);
 }
 return out;
}

function invite(){
 modal('m_invite',[
  {n:'n',l:'fl_name',req:true},
  {n:'e',l:'fl_email',type:'email',req:true,chk:function(v){return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)?'':'err_email'}},
  {n:'r',l:'fl_role',type:'select',opts:[['collaborator',t('r_collab')],['secretary',t('r_s')],['trainee',t('r_t')]],v:'collaborator'},
  {n:'p1',l:'inv_pw',type:'password',req:true,chk:typeof secPwChk==='function'?secPwChk:function(v){return (v&&v.length>=8)?'':'sec_pw_hint'},hint:t('inv_pw_hint')},
  {n:'p2',l:'inv_pw2',type:'password',req:true}
 ],function(v){
  if(v.p1!==v.p2){toast(t('sec_mismatch'));return}
  var role=v.r==='secretary'?'secretary':(v.r==='trainee'?'trainee':'collaborator');
  var rk=ROLE_RK[role]||'r_collab';
  var base=(v.n||'u').replace(/\s+/g,'').slice(0,8).toLowerCase()||'u';
  var id=base,n=1;while(U.some(function(u){return u.id===id})){id=base+n;n++}
  var initCh=(v.n||'?').trim().charAt(0)||'?';
  function finish(pwRec){
   U.push({id:id,role:role,n:{ar:v.n,fr:v.n},rk:rk,init:{ar:initCh,fr:initCh},email:v.e});
   S.auth=S.auth||{sessions:[],log:[],roles:{}};S.auth.roles=S.auth.roles||{};S.auth.roles[id]=role;
   if(pwRec){S.userPasswords=S.userPasswords||{};S.userPasswords[id]=pwRec}
   S.invites.push({n:v.n,e:v.e,r:rk,userId:id,hasPw:!!pwRec});
   if(typeof authLog==='function')authLog('invite',id,role);
   if(typeof authLog==='function'&&pwRec)authLog('pwset',id);
   if(typeof v9save==='function')v9save();else if(typeof scheduleSave==='function')scheduleSave();
   toast(t('inv_ok_pw')+' — '+t(rk));chrome();render()
  }
  if(typeof hashPass==='function'&&typeof crypto!=='undefined'&&crypto.subtle){
   hashPass(v.p1).then(finish).catch(function(){toast(t('sec_err_generic')||'⚠');finish(null)})
  }else{
   /* fallback: store marker that first login must set (empty means prompt on switch) */
   finish(null);toast(t('t_invite')+' — '+t(rk))
  }
 },'send')}

/* ================= V9.9 — نظام الفترة التجريبية والتفعيل (Trial & License) =================

   المفاتيح تُولَّد بمولّد داخلي سرّي لا يُرفع إلى المستودع ولا يُنشر على GitHub Pages.
   جُدِّدت بذور التوليد SA/SB/SC في 2026 بعد أن صار المولّد القديم مقروءاً في تاريخ Git،
   فصار كل مفتاح صادر بالبذور القديمة لاغياً (ومنها المفتاح التجريبي القديم).
   بذرة SG بقيت دون تغيير عن قصد: عليها يتوقف معرّف الجهاز وتوقيع سجل التجربة والترخيص
   المحفوظين محلياً، فتغييرها كان سيُفقد التفعيل ويُعيد بدء العدّاد على الأجهزة القائمة. */
var _LK_ON=false;
var _LIC=(function(){
 var _rev=function(b){try{var v=atob(b);return v.split('').reverse().join('')}catch(_){return ''}};
 var SA=_rev('dDRacThSdnxBfDYyMDJ8bmF3aUQ='),SB=_rev('azZQbTNZd3xCfDYyMDJ8bmF3aUQ='),SC=_rev('ZjJCZDlLbnxDfDYyMDJ8bmF3aUQ='),SG=_rev('NFB4fFN8OW5hd2lE'),
     KT=_rev('MXZfbGFpcnRfbmF3aWQ='),KL=_rev('MXZfZXNuZWNpbF9uYXdpZA=='),CK=_rev('cnRfd2Q='),
     AL='0123456789ABCDEFGHJKMNPQRSTVWXYZ',DAYS=30,CMAX=(10*365*24*3600);
 var _booted=false,_fails=0,_lastTick=0;
 function H(str){var h=0x811c9dc5,i,s=String(str);for(i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h+((h<<1)+(h<<4)+(h<<7)+(h<<8)+(h<<24)))>>>0}return h>>>0}
 function X(x){x=(x||0x9e3779b9)>>>0;x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;return x>>>0}
 function sig(p){var x=(H(SC+'|'+p)||0x1234567)>>>0,o='',i;for(i=0;i<4;i++){x=X(x);o+=AL.charAt(x&31)}return o}
 function body(seed){var x=(H(SA+'|'+seed)^H(SB+'|'+seed+'~'))>>>0;x=x||0x9e3779b9;var o='',i;for(i=0;i<12;i++){x=X(x);o+=AL.charAt(x&31)}return o}
 function fmt(k){return String(k).replace(/(.{4})(?=.)/g,'$1-')}
 function norm(k){return String(k||'').toUpperCase().replace(/[^0-9A-Z]/g,'')}
 function eq(a,b){if(a.length!==b.length)return false;var r=0,i;for(i=0;i<a.length;i++)r|=a.charCodeAt(i)^b.charCodeAt(i);return r===0}
 function validKey(k){var n=norm(k),i;if(n.length!==16)return false;for(i=0;i<16;i++)if(AL.indexOf(n.charAt(i))<0)return false;return eq(n.slice(12),sig(n.slice(0,12)))}
 function lsGet(k){try{return localStorage.getItem(k)}catch(_){return null}}
 function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}
 function pack(o){var d=JSON.stringify(o);return JSON.stringify({d:d,s:String(H(SG+'|'+d))})}
 function unpack(raw){try{var o=JSON.parse(raw);if(!o||typeof o.d!=='string'||String(o.s)!==String(H(SG+'|'+o.d)))return null;return JSON.parse(o.d)}catch(_){return null}}
 function ckGet(){try{var m=document.cookie.match(new RegExp('(?:^|; )'+CK+'=(\\d+)'));return m?+m[1]:0}catch(_){return 0}}
 function ckSet(v){try{document.cookie=CK+'='+v+';path=/;max-age='+CMAX+';SameSite=Lax'}catch(_){}}
 function rec(){var r=unpack(lsGet(KT)||''),c=ckGet();
  if(!r||!isFinite(+r.s)||+r.s<=0){if(c){r={s:c,l:0}}else{r={s:Date.now(),l:0};lsSet(KT,pack(r))}}
  else if(c&&c<+r.s){r.s=c;lsSet(KT,pack(r))}
  if(!c)ckSet(r.s);

 function state(){var r=rec(),now=Date.now(),l=+(r.l||0),back=false;
  if(l&&now<l-21600000){back=true;now=l}
  if(now>l){r.l=now;lsSet(KT,pack(r))}
  var lic=unpack(lsGet(KL)||''),ok=!!(lic&&lic.k&&validKey(lic.k)),
      el=(now-(+r.s))/86400000,left=Math.max(0,Math.ceil(DAYS-el));
  return {licensed:ok,key:ok?norm(lic.k):'',start:+r.s,elapsed:el,left:left,expired:!ok&&el>=DAYS,back:back,pct:Math.max(0,Math.min(100,Math.round((1-el/DAYS)*100)))}
 }
 function devId(){var r=rec(),ua=(navigator.userAgent||'')+'|'+(screen.width||0)+'x'+(screen.height||0),
  a=H(SG+'|dv|'+r.s+'|'+ua).toString(36).toUpperCase(),b=H(SG+'|dw|'+r.s+'|'+ua).toString(36).toUpperCase(),
  s=(a+b+'00000000').slice(0,8);return s.slice(0,4)+'-'+s.slice(4,8)}
 function lockHtml(mode){
  var st=state();
  return '<div class="modal" style="max-width:480px;text-align:center">'
   +'<img src="./logo.png" alt="Diwan" style="width:88px;height:88px;object-fit:contain;background:#fff;border-radius:20px;padding:6px;margin:0 auto 14px;display:block">'
   +'<h2 style="margin:0 0 8px;font-size:23px">'+(mode?t('lck_end_t'):t('lck_act_t'))+'</h2>'
   +'<p class="sub" style="margin:0 0 14px;line-height:1.85">'+(mode?t('lck_end_d'):t('lck_act_d'))+'</p>'
   +'<form id="licForm" novalidate><div class="fld" style="text-align:start"><label for="licKey">'+t('lck_key_l')+'</label>'
   +'<input id="licKey" dir="ltr" autocomplete="off" spellcheck="false" maxlength="19" placeholder="XXXX-XXXX-XXXX-XXXX" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:3px;text-align:center;font-size:16px"></div>'
   +'<div class="lk-msg" id="licMsg" role="alert"></div>'
   +'<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary" type="submit" id="licBtn">'+t('lck_activate')+'</button>'
   +(mode?'':'<button class="btn" type="button" id="licClose">'+t('lck_close')+'</button>')+'</div></form>'
   +'<div class="kv" style="margin-top:14px"><span>'+t('lck_dev')+'</span><code dir="ltr" style="font-family:ui-monospace,monospace">'+devId()+'</code></div>'
   +'<small class="lk-note">'+t('lck_need')+'</small></div>'
 }
 function bind(o,mode){
  var f=o.querySelector('#licForm'),inp=o.querySelector('#licKey'),msg=o.querySelector('#licMsg'),btn=o.querySelector('#licBtn');
  if(!f||!inp)return;
  inp.addEventListener('input',function(){inp.value=fmt(norm(inp.value).slice(0,16))});
  var cl=o.querySelector('#licClose');if(cl)cl.addEventListener('click',function(){secCloseOverlay()});
  try{inp.focus()}catch(_){}
  f.addEventListener('submit',function(e){e.preventDefault();
   if(_fails>=5){msg.textContent=t('lck_wait');return}
   var n=norm(inp.value);
   if(!validKey(n)){_fails++;msg.textContent=t('lck_bad');
    if(_fails>=5)setTimeout(function(){_fails=0},60000);return}
   lsSet(KL,pack({k:fmt(n),a:Date.now()}));
   _LK_ON=false;_fails=0;
   try{secCloseOverlay()}catch(_){}
   try{toast(t('lck_ok'))}catch(_){}
   var wasBooted=_booted;
   if(!wasBooted){_booted=true;try{secBoot()}catch(_){try{chrome();render()}catch(__){}}}
   else{try{chrome();render()}catch(_){}}
  });
 }
 function show(mode){var o=secOverlay(lockHtml(mode));bind(o,mode);return o}
 return {
  status:state, devId:devId, makeKey:function(seed){var b=body(String(seed));return fmt(b+sig(b))},
  valid:validKey, norm:norm, fmt:fmt,
  gate:function(){if(_LK_ON)return true;var st=state();if(st.expired&&!st.licensed){_LK_ON=true;show(true);return true}return false},
  booted:function(){_booted=true},
  openActivation:function(){_LK_ON=false;show(false)},
  tick:function(){var n=Date.now();if(n-_lastTick<60000)return;_lastTick=n;
   if(!_LK_ON&&!_booted)return;
   var st=state();if(st.expired&&!st.licensed){_LK_ON=true;show(true)}},
  locked:function(){return _LK_ON}
 };
})();
function licenseCard(){var st=_LIC.status(),warn=!st.licensed&&st.left<=7,
 col=st.licensed?'var(--ok)':(warn?'var(--bad)':'var(--ink)'),
 lbl=st.licensed?t('lck_active'):(st.left<=1?t('lck_lastday'):t('lck_days',st.left));
 return '<section class="card" style="margin-bottom:16px"><div class="card-h"><h2>'+t('lck_card_t')+'</h2><span class="chip '+(st.licensed?'ok':(warn?'urgent':''))+'">'+(st.licensed?t('lck_full'):t('lck_trial'))+'</span></div>'
 +'<div class="card-b"><div class="kv"><span>'+t('lck_status')+'</span><b style="color:'+col+'">'+lbl+'</b></div>'
 +(st.licensed?'':'<div style="height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 10px"><div style="width:'+st.pct+'%;height:100%;background:'+(warn?'var(--bad)':'var(--teal)')+'"></div></div>')
 +'<p class="sub" style="margin:0 0 12px">'+(st.licensed?t('lck_active_sub'):t('lck_trial_sub'))+'</p>'
 +'<div class="kv"><span>'+t('lck_dev')+'</span><code dir="ltr" style="font-family:ui-monospace,monospace">'+_LIC.devId()+'</code></div>'
 +'<button class="btn sm primary" data-act="licopen">'+(st.licensed?t('lck_btn_full'):t('lck_btn'))+'</button></div></section>';
}

function ftsStrip(h){return String(h||'').replace(/<style[\s\S]*?<\/style>/gi,' ').replace(/<[^>]*>/g,' ').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/\s+/g,' ').trim()}
function ftsSnip(txt,q){var t=String(txt||''),n=normName(t),k=normName(q);if(!k)return t.slice(0,180);var i=n.indexOf(k);if(i<0)return t.slice(0,180);var st=Math.max(0,i-60);return (st?'… ':'')+t.slice(st,i+Math.max(k.length,24)+110)+' …'}
function ftsHi(s,q){var e=esc(s);if(!q)return e;var r=String(q).replace(/[-\/\\^$*+?.()|[\]{}]/g,'\\$&');try{return e.replace(new RegExp('('+r+')','gi'),'<span class="hit">$1</span>')}catch(_){return e}}
function ftsSearch(q){
 var k=normName(q),out=[];if(!k)return out;
 var hit=function(x){return normName(x).indexOf(k)>=0};
 (S.drafts||[]).forEach(function(d){var body=ftsStrip(d.body);if(hit(d.title||'')||hit(body))out.push({g:'drafts',title:(d.title||t('dg_pdf_name')),meta:(d.type||'')+(d.at?' · '+d.at:''),snip:ftsSnip(body||d.title||'',q)})});
 (S.docs||[]).forEach(function(d){var c=byC(d.c);if(!c||!canSee(c))return;if(hit(tr(d.n)))out.push({g:'docs',title:tr(d.n),meta:c.no+' · '+fmt(d.d),snip:tr(c.title)})});
 (S.jurisprudence||[]).forEach(function(j){var body=(j.court||'')+' '+(j.kw||'')+' '+(j.text||'')+' '+(j.ref||'');if(hit(body))out.push({g:'juris',title:(j.court||'')+' — '+(j.ref||''),meta:String(j.year||''),snip:ftsSnip(j.text||'',q)})});
 (S.glossary||[]).forEach(function(g){var body=(g.ar||'')+' '+(g.fr||'')+' '+(g.d||'');if(hit(body))out.push({g:'glos',title:(g.ar||'')+' — '+(g.fr||''),meta:'',snip:ftsSnip(g.d||'',q)})});
 return out}

/* ================= V9.10 — تعبئة الوثائق تلقائياً + الدمغة ================= */
function dgAutofill(cid){
 var c=byC(+cid);if(!c)return false;
 var ps=(c.parties||[]).map(normParty);
 var cl=ps.filter(function(p){return p.role==='client'})[0]||ps[0]||null;
 var op=ps.filter(function(p){return p.role==='opponent'})[0]||null;
 var dg=S.docGen,cab=S.cabinet||{},ci=0,i;
 for(i=0;i<COURTS.length;i++){if(tr(COURTS[i])===tr(c.court)){ci=i;break}}
 dg.caseId=String(c.id);dg.caseNo=c.no||'';dg.court=String(ci);dg.courtName=tr(COURTS[ci]);
 if(cl){dg.pName=pFull(cl);dg.pAddr=tr(cl.address);dg.pQuality=cl.kind==='legal'?'legal':'natural';dg.pCompany=cl.kind==='legal'?pFull(cl):''}
 if(op){dg.dName=pFull(op);dg.dAddr=tr(op.address);dg.dQuality=op.kind==='legal'?'legal':'natural';dg.dCompany=op.kind==='legal'?pFull(op):''}
 dg.subject=tr(c.title);dg.lawyerName=tr(cab.name)||'';dg.lawyerAddr=tr(cab.address)||'';dg.lawyerPhone=cab.phone||'';
 dg.priorAdmin=c.priorAdmin||c.adminRecourse||'';dg.refNo=dg.refNo||c.no||'';
 if(c.judg)dg.judgment=tr(c.judg);
 if(c.delibDate)dg.sessionDate=c.delibDate;
 return true}
function dgStampPlan(){
 var dg=S.docGen||{},c=dg.caseId?byC(+dg.caseId):null,kind=stampKindOf(dg.court);
 if(dg.stampFirst==='0')return {mode:'skip',kind:kind,c:c};
 if(c&&c.judicialAid)return {mode:'exempt_ja',kind:kind,c:c};
 var first=STAMP_FIRST_TYPES.indexOf(dg.type||'open')>=0;
 if(dg.stampFirst==='1')first=true;
 if(!first)return {mode:'exempt_memo',kind:kind,c:c};
 return {mode:'use',kind:kind,c:c}}
function dgStampBanner(){
 var p=dgStampPlan(),n=stampBal(p.kind);
 var cls=p.mode==='use'?(n>0?'stamp':'bad'):'exempt';
 var txt=p.mode==='use'?t('stamp_taken'):p.mode==='exempt_ja'?t('stamp_exempt_ja'):p.mode==='exempt_memo'?t('stamp_exempt_memo'):t('stamp_skip');
 return '<div class="note" style="margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="chip '+cls+'">'+t('dg_stamp_lbl')+'</span><span style="flex:1">'+esc(txt)+(p.mode==='use'?' — '+esc(stampKindName(p.kind))+' ('+n+')':'')+'</span></div>'}
function stampOnDocPrint(){
 var dg=S.docGen||{},p=dgStampPlan(),label=(dg.type||'open')+' '+(dg.caseNo||'');
 if(p.mode==='use'){
  var dup=(S.stampMoves||[]).some(function(m){return m.type==='use'&&!m.exempt&&m.d===K(TODAY)&&m.caseId===(p.c?p.c.id:null)&&m.label===label});
  if(dup)return {state:'dup'};
  var res=stampConsume(p.kind,p.c?p.c.id:null,label,false);
  if(res.state==='ok')toast(t('stamp_taken'));else if(res.state==='empty')toast(t('stamp_empty'));
  try{scheduleSave()}catch(_){}return res}
 if(p.mode==='exempt_ja'||p.mode==='exempt_memo'){stampConsume(p.kind,null,label,true);try{scheduleSave()}catch(_){}}
 return {state:'none'}}

/* ---------- 3) الجرد السنوي (Tax export) ---------- */
function recDateOf(x){return String((x&&(x.d||x.date||x.at))||'')}
function invYears(){
 var ys={},add=function(d){var y=recDateOf({d:d});if(/^\d{4}$/.test(y.slice(0,4)))ys[y.slice(0,4)]=1};
 (S.pays||[]).forEach(function(p){add(p.d||p.date)});
 (S.trust||[]).forEach(function(x){add(x.date||x.d)});
 (S.expenses||[]).forEach(function(x){add(x.d)});
 (S.caseExpenses||[]).forEach(function(x){add(x.d)});
 (S.invoices||[]).forEach(function(i){add(i.date)});
 var out=Object.keys(ys).sort().reverse(),cur=String(TODAY.getFullYear());
 if(out.indexOf(cur)<0)out.unshift(cur);
 return out}
function invYear(){return String(S.invYear||TODAY.getFullYear())}
function annualRows(year){
 var out=[];
 visCases().forEach(function(c){
  var fees=(S.pays||[]).filter(function(p){return (p.c===c.id||p.caseId===c.id)&&recDateOf(p).slice(0,4)===year}).reduce(function(a,p){return a+(+p.a||+p.amount||0)},0);
  var dep=(S.trust||[]).filter(function(x){return x.c===c.id&&recDateOf(x).slice(0,4)===year&&x.type==='deposit'}).reduce(function(a,x){return a+(+x.amount||0)},0);
  var wd=(S.trust||[]).filter(function(x){return x.c===c.id&&recDateOf(x).slice(0,4)===year&&x.type==='withdraw'}).reduce(function(a,x){return a+(+x.amount||0)},0);
  var exp=(S.caseExpenses||[]).filter(function(x){return x.caseId===c.id&&recDateOf(x).slice(0,4)===year}).reduce(function(a,x){return a+(+x.amount||0)},0);
  if(fees||dep||wd||exp)out.push({c:c,fees:fees,trust:dep-wd,exp:exp})});
 return out}
function annualTotals(rows){return rows.reduce(function(t,r){return {fees:t.fees+r.fees,trust:t.trust+r.trust,exp:t.exp+r.exp}},{fees:0,trust:0,exp:0})}

 return '<div class="filters"><div class="fld" style="margin:0;min-width:140px"><label for="invYearSel">'+t('tax_year')+'</label><select id="invYearSel">'+opts+'</select></div>'
  +'<button class="btn primary" data-act="invprint">'+ic('print')+' '+t('inv_year_print')+'</button></div>'
  +'<p class="sub" style="margin:0 0 14px">'+t('inv_year_sub')+' — '+t('inv_year_cases',rows.length)+'</p>'
  +'<div class="kpis">'+kp('teal','coin',t('inv_fees_net'),tt.fees,t('tab_invoices'))+kp('info','shield',t('inv_trust_total'),tt.trust,t('trust_title'))+kp('brass','bills',t('inv_caseexp_total'),tt.exp,t('caseexp_title'))+'</div>'
  +'<section class="card"><div class="card-h"><h2>'+t('inv_year_title')+' — '+y+'</h2></div><div class="card-b" style="overflow-x:auto">'
  +'<table class="matrix" style="width:100%"><thead><tr><th>'+t('inv_col_case')+'</th><th>'+t('c_subject')+'</th><th>'+t('inv_col_fees')+'</th><th>'+t('inv_col_trust')+'</th><th>'+t('inv_col_exp')+'</th></tr></thead><tbody>'
  +(tb||'<tr><td colspan="5">'+t('inv_year_empty')+'</td></tr>')
  +'</tbody><tfoot><tr><th>'+t('inv_grand')+'</th><th></th><th>'+money(tt.fees)+'</th><th>'+money(tt.trust)+'</th><th>'+money(tt.exp)+'</th></tr></tfoot></table>'
  +'<p class="sub" style="margin-top:10px;font-size:12px">'+t('inv_year_note')+'</p></div></section>'}
function printAnnual(){
 var y=invYear(),rows=annualRows(y),tt=annualTotals(rows),cab=S.cabinet||{};
 var trs=rows.map(function(r,i){return '<tr><td>'+(i+1)+'</td><td dir="ltr">'+esc(r.c.no)+'</td><td>'+esc(tr(r.c.title))+'</td><td>'+money(r.fees)+'</td><td>'+money(r.trust)+'</td><td>'+money(r.exp)+'</td></tr>'}).join('');

var _timer={cid:null,start:null,tick:null};
function timerStart(cid){
 if(_timer.cid&&_timer.cid!==cid)timerStop();
 if(_timer.cid===cid)return;
 _timer.cid=cid;_timer.start=Date.now();
 if(_timer.tick)clearInterval(_timer.tick);
 _timer.tick=setInterval(function(){var el=document.getElementById('timerDisp');if(el){var s=Math.floor((Date.now()-_timer.start)/1000);el.textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},500);
 renderTimerWidget(byC(cid));
}
function timerStop(){
 if(!_timer.cid||!_timer.start)return;
 var cid=_timer.cid,dur=Math.floor((Date.now()-_timer.start)/1000);
 if(_timer.tick){clearInterval(_timer.tick);_timer.tick=null}
 _timer.cid=null;_timer.start=null;
 if(dur<30){toast('—');if(typeof openDrawer==='function')openDrawer(cid);return}
 var c=byC(cid);if(!c)return;
 c.timeEntries=c.timeEntries||[];
 c.timeEntries.unshift({start:new Date(Date.now()-dur*1000).toISOString(),duration:dur,desc:'',by:S.user});
 c.hours=(c.hours||0)+dur/3600;
 try{v9save()}catch(_){try{scheduleSave()}catch(__){}}
 toast(t('t_time_saved'));
 if(typeof openDrawer==='function')openDrawer(cid);
}

  c.hours=(c.hours||0)+sec/3600;

function agingReport(){
 var buckets={'0-30':0,'31-60':0,'61-90':0,'90+':0}, rows=[];
 (S.cases||[]).forEach(function(c){
  if(!canSee(c))return;
  var due=dueOf(c);if(due<=0)return;
  var pays=(S.pays||[]).filter(function(p){return p.c===c.id||p.caseId===c.id}).sort(function(a,b){return D(b.d)-D(a.d)});
  var base=pays.length?D(pays[0].d):D(c.opened||c.next||K(TODAY));
  var age=base&&!isNaN(base.getTime())?Math.floor((TODAY-base)/86400000):0;
  var b=age<=30?'0-30':age<=60?'31-60':age<=90?'61-90':'90+';
  buckets[b]+=due;
  rows.push({c:c,due:due,age:age,bucket:b});
 });
 rows.sort(function(a,b){return b.due-a.due});
 return {buckets:buckets,rows:rows.slice(0,10)};
}
